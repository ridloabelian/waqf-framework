name: "WAQF Initiative (v1.3 · Wijhah · 'Azam · Qiyam)"
description: "Mulai inisiatif, fitur besar, atau program kuartalan baru menggunakan pagar 13 Protokol WAQF-v1.3 + 6 mekanisme kecepatan Ijtihadi."
title: "[WAQF] <Nama Inisiatif>"
labels: ["waqf-initiative", "stage:azam-syura"]
body:
  - type: markdown
    attributes:
      value: |
        Gunakan form ini untuk mengunci **Disiplin W — Wijhah (`Niyyah, Ru'yah, Al-Miqdar, Idiot Index & Single-Fire`)**, **Disiplin A — 'Azam (`Syura 70% Data, Pangkas Birokrasi & Tafwidh`)**, dan kesiapan **Disiplin Q — Qiyam (`Itqan, Goldilocks +4%, Signal >=80%, Skip-Level & La Yuqallad`)** sebelum eksekusi dimulai.

  - type: input
    id: project_code
    attributes:
      label: "Kode Proyek & Primary DRI (Al-Qawiyy Al-Amin — Lulus 1-Question Truth Test)"
      placeholder: "Contoh: PRJ-2026-Q4-01 · DRI: @username"
    validations:
      required: true

  - type: textarea
    id: wijhah_niyyah_maslahah
    attributes:
      label: "W.1 Al-Niyyah & Maslahah (Protokol P01 · Innamal A'malu bin-Niyyat)"
      description: "Mengapa inisiatif ini layak secara amanah di hadapan Allah ﷻ, dan apa manfaat konkret bagi umat/pelanggan?"
      placeholder: |
        - Niat vertikal: ...
        - Maslahah nyata bagi pengguna/umat: ...
    validations:
      required: true

  - type: textarea
    id: wijhah_bisyarah_miqdar
    attributes:
      label: "W.2 Al-Bisyarah, Al-Miqdar, Idiot Index & Single-Fire (Protokol P02 & P03 v1.3)"
      description: "Visi menang + 1–3 target kuantitatif + batas modal/risiko + Idiot Index RAB + fokus Single-Fire (≥80% energi di 1 bottleneck)."
      placeholder: |
        - Al-Bisyarah (Guiding Vision): ...
        1. Target Utama + Deadline: ...
        2. Pagu Risiko / Anggaran Maksimal: ...
        - Idiot Index RAB (Harga Vendor / Biaya Komponen Fisik Dasar): ...
        - Single-Fire Bottleneck (sisanya Freeze): ...
    validations:
      required: true

  - type: textarea
    id: azam_tauqifi_ijtihadi
    attributes:
      label: "A.1 Pagar 100% Tauqifi vs. 70% Ijtihadi & Pangkas Birokrasi (Protokol P04–P05)"
      description: "Pisahkan prinsip harga mati (100% Tauqifi) dari taktik cepat 70% data; hapus ≥20–30% langkah birokrasi pra-otomasi dan cantumkan Kill Trigger."
      placeholder: |
        **Domain 100% Tauqifi (Harga Mati):**
        - ...
        **Langkah Birokrasi Dihapus Pre-Otomasi (≥20–30%):**
        - ...
        **Domain Ijtihadi (≥70% Data · Timebox Syura P1 < 30m / P0 < 2j) & Kill Trigger:**
        - ...
    validations:
      required: true

  - type: textarea
    id: qiyam_itqan_ianah
    attributes:
      label: "Q.1 DoD (Goldilocks +4%, Protected Maker Timeblock 3-4j & Signal >=80%), Skip-Level & La Yuqallad (P07–P09)"
      description: "Standar tuntas + Protected Maker Timeblock (3-4j Zero-Meeting / Async-First) + ko-lokalisasi leader di bottleneck + jalur skip-level tercepat + jaminan tidur >=6j / nol overwork 120j / bayar hak H+0."
      placeholder: |
        - Definition of Done (Al-Itqan + Goldilocks +4% + Protected Maker Timeblock 3-4j Zero-Meeting / Async-First + Signal >= 80%): ...
        - Ko-lokalisasi leader di bottleneck kritis (Al-Uswah): ...
        - Unblocking skip-level & komitmen bayar H+0 (Fa-a'inuhum + La Yuqallad): ...
    validations:
      required: true

  - type: checkboxes
    id: preflight_checks
    attributes:
      label: "Checklist Pre-Flight WAQF-v1.3 (Protokol P01–P09)"
      options:
        - label: "DRI lolos 1-Question Truth Test (akar kegagalan mikroskopis) & uji Al-Amanah (Protokol P06 · Abu Dzar)."
          required: true
        - label: "Syura ber-timebox (P1 < 30m / P0 < 2j) di ≥70% data melahirkan 'Azam + Kill Trigger objektif (Protokol P05 · Badar)."
          required: true
        - label: "Pagar La Yuqallad (tidur ≥6j, nol kerja 100–120j, nol penghinaan) & jadwal Mid-Cycle Hisbah dikunci."
          required: true
