name: "WAQF Initiative (Wijhah · 'Azam · Qiyam)"
description: "Mulai inisiatif, fitur besar, atau program kuartalan baru menggunakan pagar 13 Protokol WAQF / NSIM."
title: "[WAQF] <Nama Inisiatif>"
labels: ["waqf-initiative", "stage:azam-syura"]
body:
  - type: markdown
    attributes:
      value: |
        Gunakan form ini untuk mengunci **Disiplin W — Wijhah (`Niyyah & Ru'yah`)**, **Disiplin A — 'Azam (`Syura & Tadbir`)**, dan kesiapan **Disiplin Q — Qiyam (`Itqan & I'anah`)** sebelum eksekusi dimulai.

  - type: input
    id: project_code
    attributes:
      label: "Kode Proyek & Primary DRI (Al-Qawiyy Al-Amin)"
      placeholder: "Contoh: PRJ-2026-Q4-01 · DRI: @username"
    validations:
      required: true

  - type: textarea
    id: wijhah_niyyah_maslahah
    attributes:
      label: "W.1 Al-Niyyah & Maslahah (Protokol P01 · Innamal A'malu bin-Niyyat)"
      description: "Mengapa inisiatif ini layak secara amanah di hadapan Allah ﷻ, dan apa manfaat konkret bagi umat/pelanggan?"
      placeholder: |
        - Niat vertikal: ...
        - Maslahah nyata bagi pengguna/umat: ...
    validations:
      required: true

  - type: textarea
    id: wijhah_bisyarah_miqdar
    attributes:
      label: "W.2 Al-Bisyarah & 1–3 Target Al-Miqdar (Protokol P02 & P03)"
      description: "Visi menang + target kuantitatif, tanggal selesai pasti, dan batas modal/risiko maksimal."
      placeholder: |
        - Al-Bisyarah (Guiding Vision): ...
        1. Target Utama + Deadline: ...
        2. Target Kualitas + Deadline: ...
        3. Pagu Risiko / Anggaran Maksimal: ...
    validations:
      required: true

  - type: textarea
    id: azam_tauqifi_ijtihadi
    attributes:
      label: "A.1 Pagar Tauqifi vs. Ruang Ijtihadi (Protokol P04 · Hubab bin Mundzir)"
      description: "Pisahkan prinsip harga mati (syariat, akad, keamanan data, hukum) dari taktik adaptif yang terbuka untuk kritik tim."
      placeholder: |
        **Domain Tauqifi (Tidak Boleh Ditawar):**
        - ...
        **Domain Ijtihadi (Terbuka Kritik & Koreksi Tim):**
        - ...
    validations:
      required: true

  - type: textarea
    id: qiyam_itqan_ianah
    attributes:
      label: "Q.1 Definition of Done (Itqan) & Dukungan Manajer (Fa-a'inuhum) (P07–P09)"
      description: "Standar tuntas presisi + kehadiran leader di garis depan + sumber daya/unblocking manajer + tanggal komitmen hak mitra."
      placeholder: |
        - Definition of Done (Al-Itqan): ...
        - Titik hadir langsung leader (Al-Uswah): ...
        - Dukungan & unblocking manajer (Fa-a'inuhum): ...
    validations:
      required: true

  - type: checkboxes
    id: preflight_checks
    attributes:
      label: "Checklist Pre-Flight WAQF Framework (Protokol P01–P09)"
      options:
        - label: "Seluruh PIC lulus uji Al-Quwwah (kompeten) & Al-Amanah (Protokol P06 · Abu Dzar)."
          required: true
        - label: "Rencana sudah dibahas di Syura dan disepakati tim pelaksana sebagai 'Azam bersama (Protokol P05 · Badar)."
          required: true
        - label: "Jadwal inspeksi tengah jalan (Mid-Cycle Hisbah) sudah ditetapkan."
          required: true
