name: "Audit Hisbah & Muhasabah (Mid/End Review)"
description: "Evaluasi tengah jalan (Hisbah) atau tutup siklus (Muhasabah) wajib berbasis bukti fisik At-Tahqiq & Audit Anti-Gratifikasi."
title: "[MUHASABAH] <Kode Proyek / Periode>"
labels: ["nsim-review", "hisbah-audit"]
body:
  - type: markdown
    attributes:
      value: |
        Formulir ini menjalankan **Disiplin 4 (Muhasabah & Hisbah)**: verifikasi bukti fisik (*At-Tahqiq*), audit hasil + anti-gratifikasi (*Ibnul Lutbiyyah*), dan perbaikan sistemik (*Islah · Ta'ridh*).

  - type: dropdown
    id: audit_phase
    attributes:
      label: "Jenis Sesi Evaluasi"
      options:
        - "Mid-Cycle Hisbah (Inspeksi Proses Tengah Jalan)"
        - "End-of-Cycle Muhasabah (Audit Penutupan Siklus)"
    validations:
      required: true

  - type: input
    id: ref_initiative
    attributes:
      label: "Referensi Issue / Kode Proyek NSIM"
      placeholder: "#1 · PRJ-2026-Q4-01"
    validations:
      required: true

  - type: textarea
    id: at_tahqiq_evidence
    attributes:
      label: "1. Daftar Bukti Fisik Terverifikasi (Protokol Dua Pemuda Badar / At-Tahqiq)"
      description: "DILARANG klaim lisan. Lampirkan link log produksi, mutasi rekening, merged PR, dokumen sah, atau foto lapangan."
      placeholder: |
        - KPI 1: [Capaian aktual] — Bukti: [URL / Ref Dokumen]
        - KPI 2: [Capaian aktual] — Bukti: [URL / Ref Dokumen]
    validations:
      required: true

  - type: textarea
    id: hisbah_integrity
    attributes:
      label: "2. Audit Kepatuhan Tauqifi & Anti-Gratifikasi (Protokol Hisbah & Ibnul Lutbiyyah)"
      description: "Cek kehalalan proses, kesesuaian akad, pemisahan aset pribadi vs. lembaga, dan nol komisi/hadiah tersembunyi."
      placeholder: |
        - Status Pagar Tauqifi & Akad: BERSIH / TEMUAN
        - Status Pemisahan Aset & Bebas Gratifikasi: BERSIH / TEMUAN
        - Catatan rinci: ...
    validations:
      required: true

  - type: textarea
    id: islah_plan
    attributes:
      label: "3. Perbaikan Sistemik / SOP (Protokol Ta'ridh & Bani Makhzum)"
      description: "Apa pola masalah yang ditemukan (tanpa mempermalukan pribadi), perbaikan SOP untuk siklus depan, dan tindak lanjut keadilan?"
      placeholder: |
        - Pola akar masalah sistemik: ...
        - Update SOP / Checklist (Islah): ...
    validations:
      required: true

  - type: checkboxes
    id: audit_signoff
    attributes:
      label: "Pengesahan Audit (Protokol P10–P13)"
      options:
        - label: "Seluruh angka capaian sudah diverifikasi dengan artefak fisik nyata (At-Tahqiq)."
          required: true
        - label: "Audit integritas, akad, & anti-gratifikasi (Ibnul Lutbiyyah) telah diperiksa jujur."
          required: true
        - label: "Jika ditemukan pelanggaran amanah, penindakan berlaku setara bagi staf maupun pimpinan (Nol Impunitas Elit)."
          required: true
